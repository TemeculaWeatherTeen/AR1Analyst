<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AR1Analyst</title>
<link rel="stylesheet" href="style.css"></head><body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="ar"></canvas><canvas id="hud"></canvas>
<div id="top" class="glass">
 <div class="r"><select id="stn" aria-label="Radar station"></select><div id="ttl">AR1Analyst</div><button id="histbtn" title="Historical radar">🕘</button><button id="volbtn">▣ Vol</button><button id="gear" aria-label="Settings">⚙︎</button></div>
 <div id="prods"><span id="pbtn"></span><i></i><span id="chips"></span></div>
 <select id="tilt" hidden><option value="-1">All tilts</option></select>
</div>
<div id="info" class="glass"><b id="iStn"></b><br>VCP: <span id="iVcp">—</span></div>
<div id="info2" class="glass"><span id="iVT">VT: —</span><br><span id="iNext"></span></div>
<div id="leg" class="glass"><div class="h">dBZ</div><div id="lb"></div></div>
<div id="prod" class="glass">BR</div>
<div id="st" class="glass">Pick a station, then tap Start AR.</div>
<canvas id="ppi" width="300" height="300"></canvas>
<div id="hist" class="glass" hidden>
 <div class="row"><span>Date (UTC)</span><input id="hdate" type="date"></div>
 <div class="row"><span id="hlab">Pick a date</span></div>
 <div class="row"><button id="hprev">◀︎</button><input id="hsl" type="range" min="0" max="0" value="0"><button id="hnext">▶︎</button></div>
 <div class="row"><button id="hlive">Back to live</button><button id="hload">Load scan</button></div>
</div>
<div id="dlg" class="glass" hidden><div id="dmsg"></div><input id="dinp" inputmode="decimal" autocomplete="off"><div class="btns"><button id="dno">Cancel</button><button id="dalt" hidden></button><button id="dok">OK</button></div></div>
<button id="go">Start AR</button>
<button id="record" type="button" aria-label="Start recording" hidden>●</button>
<div id="sheet" class="glass" hidden>
 <div class="row"><span>Field of view</span><input id="fov" type="range" min="30" max="90" value="63"><output id="fovo">63°</output></div>
 <div class="row"><span>Yaw trim</span><input id="yaw" type="range" min="-180" max="180" value="0"><output id="yawo">0°</output></div>
 <div class="row"><span>Declination (° E)</span><input id="decl" type="number" step="0.5" value="0" title="magnetic declination, east positive"></div>
 <div class="row"><span>Volume density</span><input id="vden" type="range" min="5" max="80" value="25"><output id="vdeno">25</output></div>
 <div class="row"><span>Volume quality</span><select id="vq"><option>Fast</option><option selected>Balanced</option><option>Sharp</option></select></div>
 <div class="row"><span>Smoothing</span><input id="smooth" class="sw" type="checkbox" checked></div>
 <div class="row"><span>Clear-air echoes</span><input id="weak" class="sw" type="checkbox"></div>
 <div class="row"><span>Opacity</span><input id="op" type="range" min="20" max="100" value="75"><output id="opo">75%</output></div>
 <div class="row"><span>Color table</span><button id="palbtn">Upload…</button><button id="palreset">Reset</button><input id="palfile" type="file" accept=".pal,.pal3,.txt,.csv,text/plain" multiple hidden></div>
 <div class="row"><span>Storm motion (SRV)</span><input id="sdir" type="number" value="240" title="from °"><input id="sspd" type="number" value="0" title="kt"></div>
 <div class="row"><button id="north">⬆︎ Set north</button><button id="cal">🧭 Calibrate…</button></div>
 <div class="row"><button id="calreset">Reset heading calibration</button></div>
 <div class="row"><button id="loc">📍 Set location</button></div>
</div>
<script src="script.js"></script>
<script src="recording.js"></script></body></html>
