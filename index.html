<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AR1Analyst</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="ar"></canvas>
  <canvas id="hud"></canvas>
  <div id="ui">
    <select id="stn" aria-label="Radar station"></select>
    <button id="go">Start AR</button>
    <button id="loc">📍</button>
    <label>FOV <input id="fov" type="range" min="40" max="90" value="63"></label>
    <label>Yaw <input id="yaw" type="range" min="-180" max="180" value="0"></label>
    <details id="tilt-control">
      <summary>Elevation tilts</summary>
      <div id="tilt-options" aria-label="Select radar elevation angles">Loading scan angles…</div>
    </details>
  </div>
  <div id="st">Pick a station, then Start AR.</div>
  <canvas id="ppi" width="300" height="300"></canvas>
  <script>
    const stationSelect = document.getElementById('stn');
    const stationValues = new Set();
    const fallbackStations = [
      { id: 'KNKX', name: 'San Diego, CA' },
      { id: 'KSOX', name: 'Santa Ana Mountains, CA' },
      { id: 'KVTX', name: 'Los Angeles, CA' },
      { id: 'KMUX', name: 'San Francisco Bay Area, CA' },
      { id: 'KDAX', name: 'Sacramento, CA' },
      { id: 'KRTX', name: 'Portland, OR' },
      { id: 'KATX', name: 'Seattle, WA' },
      { id: 'KOTX', name: 'Spokane, WA' },
      { id: 'KFSX', name: 'Flagstaff, AZ' },
      { id: 'KIWA', name: 'Phoenix, AZ' },
      { id: 'KMTX', name: 'Salt Lake City, UT' },
      { id: 'KFTG', name: 'Denver, CO' },
      { id: 'KABX', name: 'Albuquerque, NM' },
      { id: 'KEPZ', name: 'El Paso, TX' },
      { id: 'KEWX', name: 'Austin/San Antonio, TX' },
      { id: 'KFWS', name: 'Dallas/Fort Worth, TX' },
      { id: 'KTLX', name: 'Oklahoma City, OK' },
      { id: 'KHGX', name: 'Houston, TX' },
      { id: 'KLOT', name: 'Chicago, IL' },
      { id: 'KMPX', name: 'Minneapolis, MN' },
      { id: 'KDVN', name: 'Davenport, IA' },
      { id: 'KEAX', name: 'Kansas City, MO' },
      { id: 'KILX', name: 'Lincoln, IL' },
      { id: 'KDTX', name: 'Detroit, MI' },
      { id: 'KCLE', name: 'Cleveland, OH' },
      { id: 'KOKX', name: 'New York City, NY' },
      { id: 'KDIX', name: 'Philadelphia, PA' },
      { id: 'KLWX', name: 'Washington, DC' },
      { id: 'KFFC', name: 'Atlanta, GA' },
      { id: 'KAMX', name: 'Miami, FL' },
      { id: 'KTBW', name: 'Tampa, FL' },
      { id: 'KJAX', name: 'Jacksonville, FL' },
      { id: 'KBOX', name: 'Boston, MA' }
    ];

    const addStationOptions = (stationList) => {
      stationSelect.replaceChildren();
      stationValues.clear();
      for (const station of stationList) {
        if (!station || !station.id) continue;
        const value = String(station.id).trim();
        if (!value || stationValues.has(value)) continue;
        stationValues.add(value);
        const option = new Option(`${value} — ${station.name || 'Radar station'}`, value);
        stationSelect.add(option);
      }
      if (!stationSelect.value && stationSelect.options.length) {
        stationSelect.value = stationSelect.options[0].value;
      }
    };

    const loadRadarStationArchive = async () => {
      const archiveUrl = 'https://www.ncdc.noaa.gov/cdo-web/services/cdo/nexrad/MapServer/0/query?where=1%3D1&outFields=STATION_ID,STATION_NAME,LATITUDE,LONGITUDE&f=geojson';
      try {
        const response = await fetch(archiveUrl, { mode: 'cors' });
        if (!response.ok) throw new Error(`Station archive request failed (${response.status})`);
        const data = await response.json();
        const stations = (data.features || [])
          .map((feature) => {
            const props = feature?.properties || {};
            const id = String(props.STATION_ID || '').trim();
            const name = String(props.STATION_NAME || '').trim();
            const lat = Number(props.LATITUDE);
            const lon = Number(props.LONGITUDE);
            if (!id || !Number.isFinite(lat) || !Number.isFinite(lon)) return null;
            return { id, name: name || `${id} radar station`, lat, lon };
          })
          .filter(Boolean)
          .sort((a, b) => a.id.localeCompare(b.id));
        if (stations.length) {
          addStationOptions(stations);
          stationSelect.value = stationSelect.value || 'KNKX';
          return;
        }
      } catch (error) {
        console.warn('Could not load NOAA radar archive; using fallback station list.', error);
      }
      addStationOptions(fallbackStations);
      stationSelect.value = 'KNKX';
    };

    new MutationObserver((records) => {
      for (const record of records) {
        for (const option of record.addedNodes) {
          if (!(option instanceof HTMLOptionElement)) continue;
          if (stationValues.has(option.value)) option.remove();
          else stationValues.add(option.value);
        }
      }
    }).observe(stationSelect, { childList: true });

    loadRadarStationArchive();
    stationSelect.value = 'KNKX';
  </script>
</body>
</html>
