<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AR1Analyst</title>
  <link rel="stylesheet" href="style.css">
  <script src="render-fix.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="ar"></canvas>
  <canvas id="hud"></canvas>
  <div id="ui">
    <select id="stn" aria-label="Radar station"></select>
    <button id="go">Start AR</button>
    <button id="loc">📍</button>
    <label>FOV <input id="fov" type="range" min="40" max="90" value="63"></label>
    <label>Yaw <input id="yaw" type="range" min="-180" max="180" value="0"></label>
    <details id="tilt-control">
      <summary>Elevation tilts</summary>
      <div id="tilt-options" aria-label="Select radar elevation angles">Loading scan angles…</div>
    </details>
  </div>
  <div id="st">Pick a station, then Start AR.</div>
  <canvas id="ppi" width="300" height="300"></canvas>
  <script>
    const stationSelect = document.getElementById('stn');
    const fallbackStations = [
      { id: 'KNKX', name: 'San Diego, CA', lat: 32.919, lon: -117.042 },
      { id: 'KSOX', name: 'Santa Ana Mountains, CA', lat: 33.818, lon: -117.636 },
      { id: 'KVTX', name: 'Los Angeles, CA', lat: 34.412, lon: -119.179 },
      { id: 'KMUX', name: 'San Francisco Bay Area, CA', lat: 37.155, lon: -121.898 },
      { id: 'KDAX', name: 'Sacramento, CA', lat: 38.501, lon: -121.678 },
      { id: 'KRTX', name: 'Portland, OR', lat: 45.715, lon: -122.965 },
      { id: 'KATX', name: 'Seattle, WA', lat: 48.195, lon: -122.496 },
      { id: 'KOTX', name: 'Spokane, WA', lat: 47.680, lon: -117.627 },
      { id: 'KFSX', name: 'Flagstaff, AZ', lat: 34.574, lon: -111.198 },
      { id: 'KIWA', name: 'Phoenix, AZ', lat: 33.289, lon: -111.669 },
      { id: 'KMTX', name: 'Salt Lake City, UT', lat: 40.700, lon: -111.900 },
      { id: 'KFTG', name: 'Denver, CO', lat: 39.786, lon: -104.545 },
      { id: 'KABX', name: 'Albuquerque, NM', lat: 35.150, lon: -106.824 },
      { id: 'KEPZ', name: 'El Paso, TX', lat: 31.874, lon: -106.698 },
      { id: 'KEWX', name: 'Austin/San Antonio, TX', lat: 29.704, lon: -98.028 },
      { id: 'KFWS', name: 'Dallas/Fort Worth, TX', lat: 32.573, lon: -97.303 },
      { id: 'KTLX', name: 'Oklahoma City, OK', lat: 35.333, lon: -97.278 },
      { id: 'KHGX', name: 'Houston, TX', lat: 29.472, lon: -95.079 },
      { id: 'KLOT', name: 'Chicago, IL', lat: 41.604, lon: -88.085 },
      { id: 'KMPX', name: 'Minneapolis, MN', lat: 44.849, lon: -93.565 },
      { id: 'KDVN', name: 'Davenport, IA', lat: 41.612, lon: -90.581 },
      { id: 'KEAX', name: 'Kansas City, MO', lat: 38.810, lon: -94.264 },
      { id: 'KILX', name: 'Lincoln, IL', lat: 40.151, lon: -89.336 },
      { id: 'KDTX', name: 'Detroit, MI', lat: 42.700, lon: -83.472 },
      { id: 'KCLE', name: 'Cleveland, OH', lat: 41.414, lon: -81.860 },
      { id: 'KOKX', name: 'New York City, NY', lat: 40.866, lon: -72.864 },
      { id: 'KDIX', name: 'Philadelphia, PA', lat: 39.947, lon: -74.411 },
      { id: 'KLWX', name: 'Washington, DC', lat: 38.976, lon: -77.477 },
      { id: 'KFFC', name: 'Atlanta, GA', lat: 33.364, lon: -84.566 },
      { id: 'KAMX', name: 'Miami, FL', lat: 25.611, lon: -80.413 },
      { id: 'KTBW', name: 'Tampa, FL', lat: 27.705, lon: -82.402 },
      { id: 'KJAX', name: 'Jacksonville, FL', lat: 30.484, lon: -81.702 },
      { id: 'KBOX', name: 'Boston, MA', lat: 41.956, lon: -71.138 }
    ];

    const normalizeRadarFeatures = (data) => {
      const features = Array.isArray(data?.features) ? data.features : [];
      return features.map((feature) => {
        const properties = feature?.properties || {};
        const id = String(properties.stationIdentifier || properties.STATION_ID || properties.id || '').trim().toUpperCase();
        const coordinates = feature?.geometry?.coordinates || [];
        const lat = Number(properties.latitude ?? properties.LATITUDE ?? coordinates[1]);
        const lon = Number(properties.longitude ?? properties.LONGITUDE ?? coordinates[0]);
        const name = String(properties.name || properties.STATION_NAME || id).trim();
        const radarType = String(properties.type || properties.radarType || '').toUpperCase();
        if (!/^[A-Z0-9]{4}$/.test(id) || !Number.isFinite(lat) || !Number.isFinite(lon)) return null;
        if (radarType && !radarType.includes('WSR-88D') && !radarType.includes('NEXRAD')) return null;
        return { id, name, lat, lon };
      }).filter(Boolean);
    };

    const addStationOptions = (stations) => {
      const previous = stationSelect.value || 'KNKX';
      const unique = [...new Map(stations.map((station) => [station.id, station])).values()]
        .sort((a, b) => a.id.localeCompare(b.id));
      stationSelect.replaceChildren(...unique.map((station) =>
        new Option(`${station.id} — ${station.name}`, station.id)));
      stationSelect.value = unique.some((station) => station.id === previous)
        ? previous
        : (unique.some((station) => station.id === 'KNKX') ? 'KNKX' : (unique[0]?.id || ''));
      window.RADAR_STATIONS = Object.fromEntries(unique.map(({ id, lat, lon }) => [id, { lat, lon }]));
    };

    // Populate immediately so the app always has a usable station even if NOAA
    // is slow, unavailable, or returns an unexpected inventory response.
    addStationOptions(fallbackStations);

    // NOAA/NWS publishes the active NEXRAD site inventory as paginated GeoJSON.
    // Keep the bundled fallback list available for offline startup.
    window.RADAR_STATIONS_READY = (async () => {
      try {
        let next = 'https://api.weather.gov/radar/stations?limit=500';
        const stations = [];
        const visited = new Set();
        while (next && !visited.has(next)) {
          visited.add(next);
          const response = await fetch(next, { headers: { Accept: 'application/geo+json, application/json' } });
          if (!response.ok) throw new Error(`NOAA station archive returned ${response.status}`);
          const data = await response.json();
          stations.push(...normalizeRadarFeatures(data));
          next = data.pagination?.next || data['@graph']?.next || null;
          if (typeof next === 'string' && next.startsWith('/')) next = `https://api.weather.gov${next}`;
        }
        if (!stations.length) throw new Error('The station archive returned no usable radar sites.');
        addStationOptions(stations);
      } catch (error) {
        console.warn('Could not load NOAA/NWS radar inventory; using the bundled fallback list.', error);
      }
    })();
  </script>
</body>
</html>
